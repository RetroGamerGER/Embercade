## Central isolated Embercade desktop profile used by both ES and configgen.
## Appliance services and host-management features are governed by desktop policy.
system.language=en_US
configgen=0

global.bezel=none
global.hud=none
global.hud_support=false
global.shaderset=none
global.videomode=default

nes.emulator=libretro
nes.core=nestopia

psx.emulator=libretro
psx.core=mednafen_psx
psx.gfxbackend=vulkan

c64.bezel=default_unglazed
nds.bezel=default_unglazed
nds.core=melondsds
nds.melondsds_render_mode=software
nds.melondsds_touchmode=joystick

psp.emulator=libretro
psp.core=ppsspp
psp.gfxbackend=vulkan
psp.ppsspp_resolution=960x544
psp.bezel=default_unglazed

3ds.emulator=libretro
3ds.core=azahar
3ds.gfxbackend=glcore
3ds.3ds_internal_resolution=1
3ds.3ds_screen_layout=default
3ds.bezel=default_unglazed

n64.emulator=libretro
n64.core=mupen64plus-next
n64.gfxbackend=glcore
n64.bezel=default_unglazed

jaguar.emulator=libretro
jaguar.core=virtualjaguar
jaguar.bezel=default_unglazed

amigacd32.bezel=default_unglazed
amiga1200.bezel=default_unglazed
dos.bezel=default_unglazed
mame.bezel=default_unglazed
dreamcast.bezel=default_unglazed
megacd.bezel=default_unglazed
neogeocd.bezel=default_unglazed
pcenginecd.bezel=default_unglazed
saturn.bezel=default_unglazed

gamecube.emulator=dolphin
gamecube.core=dolphin
gamecube.bezel=none
gamecube.hud=none
gamecube.hud_support=false

wii.emulator=dolphin
wii.core=dolphin
# Auto prefers a responding real remote; true forces gamepad, false forces real.
wii.emulatedwiimotes=auto
wii.bezel=none
wii.hud=none
wii.hud_support=false

xbox.emulator=xemu
xbox.core=xemu
xbox.bezel=none
xbox.hud=none
xbox.hud_support=false

ps2.emulator=pcsx2
ps2.core=pcsx2
ps2.bezel=none
ps2.hud=none
ps2.hud_support=false

ps3.emulator=rpcs3
ps3.core=rpcs3
ps3.bezel=none
ps3.hud=none
ps3.hud_support=false

wiiu.emulator=libretro
wiiu.core=cemu
wiiu.gfxbackend=vulkan
wiiu.bezel=none

xbox360.emulator=xenia-edge
xbox360.core=xenia-edge
xbox360.bezel=none
xbox360.hud=none
xbox360.hud_support=false
