# Embercade desktop policy. Values: supported, unsupported, hidden, desktop-managed.
# This file describes UI ownership; it never creates compatibility helpers.
game-settings=supported
controller-settings=supported
collections=supported
scraper=supported
themes=desktop-managed
shader-options=supported
decorations=supported
batocera-config=desktop-managed
future-emulators=unsupported

batocera-update=hidden
batocera-install=hidden
storage-management=hidden
services=hidden
wifi-management=hidden
bluetooth-management=hidden
system-audio-management=hidden
display-mode-switching=hidden
overclocking=hidden
tdp-power-mode=hidden
kodi=hidden
file-manager=hidden
suspend=hidden
reboot=hidden
shutdown=hidden

